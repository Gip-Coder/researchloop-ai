[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "researchloop-ai"
version = "0.1.0"
description = "Autonomous literature review agent pipeline with iterative planning, retrieval, synthesis, and self-reflection"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Member 1 (AI Engine)" },
    { name = "Member 2 (API/Frontend)" }
]
dependencies = [
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic-settings>=2.2.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
web = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic-settings>=2.2.0",
    "aiosqlite>=0.20.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "smoke: Live external API smoke tests (requires network and API keys, opt-in with RUN_LIVE_API_TESTS=1)",
]
addopts = "-ra -q"
